{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Assessment</title>
    <link rel="stylesheet" href="{% static 'create_assignment.css' %}">
</head>
<body>

<div class="container">

    <h1>Create Assessment</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Assessment Title</label>
            <input type="text" name="title" placeholder="Enter Assessment Title" required>
        </div>
        <div class="form-group">
           <label>Assignment Description</label>
            <textarea name="description" rows="6" placeholder="Enter assignment description" required></textarea>
        </div>

        <div class="form-group">
            <label>Select Course</label>
            <select name="course" required>
                <option value="">Select Course</option>
                {% for course in courses %}
                    <option value="{{ course.id }}">
                        {{ course.title }}
                    </option>
                {% endfor %}

            </select>
        </div>
        <div class="buttons">


           <a href="{% url 'assignment' %}"></a> <button type="submit" class="primary">
                Create Assessment
            </button>

        </div>

        <hr>
        
    </form>

</div>

</body>
</html>
