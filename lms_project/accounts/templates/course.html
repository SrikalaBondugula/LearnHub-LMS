{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course</title>
    <link rel="stylesheet" href="{% static 'course.css' %}">
</head>
<body>

<div class="container">

    <h1>Create New Course</h1>
   


    <form method="POST" action="">
        {% csrf_token %}

        <div class="form-group">
            <label>Course Title</label>
            <input type="text" name="title" placeholder="Enter course title" required>
        </div>

        <div class="form-group">
            <label>Course Description</label>
            <textarea name="description" rows="6" placeholder="Enter course description" required></textarea>
        </div>

       

        <a href="{% url 'my_courses' %}"><button type="submit">Create Course</button></a>

    </form>

</div>

</body>
</html>
