{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Assignment</title>
    <link rel="stylesheet" href="{% static 'edit_assignment.css' %}">
</head>

<body>

<div class="container">

    <h1>Edit Assignment</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Assignment Title</label>

            <input
                type="text"
                name="title"
                value="{{ assignment.title }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Description</label>

            <textarea
                name="description"
                rows="8"
                required
            >{{ assignment.description }}</textarea>

        </div>


        <button type="submit">
            Update Assignment
        </button>

        <a href="{% url 'assignment' %}">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
