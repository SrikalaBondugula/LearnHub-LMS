{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Course</title>

    <link rel="stylesheet" href="{% static 'course.css' %}">
</head>

<body>

<div class="container">

    <h1>Edit Course</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Course Title</label>

            <input
                type="text"
                name="title"
                value="{{ course.title }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Course Description</label>

            <textarea
                name="description"
                rows="6"
                required
            >{{ course.description }}</textarea>

        </div>


        <button type="submit">
            Update Course
        </button>
        
       <a href="{% url 'my_courses' %}" class="cancel-btn">
            Cancel
        </a>
        

    </form>

</div>

</body>

</html>
