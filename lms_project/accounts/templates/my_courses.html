{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses</title>
    <link rel="stylesheet" href="{% static 'my_courses.css' %}">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>My Courses</h1>
        <div id="buttons"> <a href="{% url 'instructor_dashboard' %}" class="btn">Dashboard</a>

        <a href="{% url 'course' %}" class="btn">
            + Add New Course
        </a></div>
       
    </div>

    <div class="course-container">

        {% for course in courses %}

        <div class="course-card">

            <h2>{{ course.title }}</h2>

            <p>{{ course.description }}</p>

            <div class="buttons">

                <a href="{% url 'add_module' course.id %}" class="manage">Manage</a>

                <a href="{% url 'edit_course' course.id %}" class="edit">Edit</a>


            </div>

        </div>

        {% empty %}

        <h2>No courses created yet.</h2>

        {% endfor %}

    </div>

</div>

</body>
</html>
