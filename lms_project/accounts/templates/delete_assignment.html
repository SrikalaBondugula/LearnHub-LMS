{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Delete Assignment</title>
    <link rel="stylesheet" href="{% static 'delete_assignment.css' %}">
</head>

<body>

<div class="container">

    <h1>Delete Assignment</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ assignment.title }}</strong>?
    </p>

    <p>
        This action cannot be undone.
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'assignment' %}">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
