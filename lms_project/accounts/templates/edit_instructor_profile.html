{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Edit Instructor Profile</title>

<link rel="stylesheet" href="{% static 'edit_instructor_profile.css' %}">
```

</head>

<body>

<div class="container">

```
<div class="edit-card">

    <div class="header">
        <h2>Edit Profile</h2>
        <p>Update your instructor account details</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label for="username">Name</label>

            <input
                type="text"
                id="username"
                name="username"
                value="{{ input_data.username|default:instructor.username }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ input_data.email|default:instructor.email }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="phoneNumber">Mobile Number</label>

            <input
                type="text"
                id="phoneNumber"
                name="phoneNumber"
                value="{{ input_data.phoneNumber|default:instructor.phoneNumber }}"
                maxlength="10"
                required
            >
        </div>

       

        <div class="buttons">

            <button type="submit" class="save-btn">
                Save Changes
            </button>

            <a href="{% url 'instructor_profile' %}" class="cancel-btn">
                Cancel
            </a>

        </div>

    </form>

</div>
```

</div>

</body>
</html>
